[project]
name = "workday-chronometric"

version = "12.0.0"

description = "Workday Chronometric Professional"

authors = [
    {name = "Vikrant Ambani"}
]

requires-python = ">=3.13"

dependencies = [
    "PySide6",
    "pandas",
    "numpy",
    "openpyxl",
    "xlsxwriter",
    "plotly",
    "pyqtgraph",
    "loguru",
    "sqlalchemy",
    "watchdog",
    "orjson"
]

[tool.pyinstaller]

onefile = true

windowed = true

icon = "assets/icon.ico"
